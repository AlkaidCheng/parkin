name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The 1st and 15th of each month: the test jobs install the newest
    # releases of the build tools and dependencies, and the scheduled run also
    # builds against xsimd's development branch, so a release that breaks
    # parkin is found within two weeks. One job installs the oldest supported
    # releases instead.
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from the tag history.
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package with the development tools
        run: python -m pip install ".[dev]" clang-format
      - name: ruff
        run: ruff check src tests
      - name: black
        run: black --check src tests
      - name: mypy
        run: mypy
      - name: clang-format
        run: git ls-files -z "cpp/*.hpp" "cpp/*.cpp" | xargs -0 clang-format --dry-run --Werror

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install with warnings as errors
        run: >
          python -m pip install -v ".[dev]"
          --config-settings=cmake.define.PARKIN_WARNINGS_AS_ERRORS=ON
      - name: pytest
        run: pytest

  cpp-tests:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The hosted runners have three or four processors
      # (https://docs.github.com/en/actions/reference/runners/github-hosted-runners).
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v7
      # The preset builds the core and its tests without Python and nanobind,
      # with warnings as errors, and runs the tests.
      - name: Configure, build and run the C++ tests
        run: cmake --workflow --preset cpp-tests

  oldest:
    name: Test with the oldest supported versions
    runs-on: ubuntu-latest
    # Python 3.11, the oldest Python supported and the only one that can
    # install the oldest NumPy, on Debian 11, whose compiler is GCC 10.2
    # (https://packages.debian.org/bullseye/g++), the oldest the build is
    # tested with.
    container: python:3.11-bullseye
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # pyproject.toml gives every build requirement and every dependency as
      # name>=version, and this step turns each into name==version.
      - name: List the oldest version of every requirement
        shell: python
        run: |
          import re
          import tomllib

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)
          requirements = project["build-system"]["requires"] + project["project"]["dependencies"]
          with open("oldest.txt", "w") as file:
              for requirement in requirements:
                  floor = re.fullmatch(r"([A-Za-z0-9_.-]+)>=([0-9.]+)", requirement)
                  if floor is None:
                      raise SystemExit(f"{requirement!r} must have the form name>=version")
                  file.write(f"{floor[1]}=={floor[2]}\n")
      # --build-constraint holds the build tools to the list as --constraint
      # holds the dependencies; pip has it from 25.3 on
      # (https://pip.pypa.io/en/stable/news/). Warnings are not errors here:
      # nanobind before 2.5.0 cannot keep its headers out of the warning level.
      - name: Build and install with those versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[dev]" --constraint oldest.txt --build-constraint oldest.txt
      - name: pytest
        run: pytest

  xsimd-development:
    name: Test against xsimd's development branch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install against xsimd master
        run: >
          python -m pip install -v ".[dev]"
          --config-settings=cmake.define.PARKIN_XSIMD_GIT_TAG=master
      - name: pytest
        run: pytest
