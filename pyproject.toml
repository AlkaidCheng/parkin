[build-system]
# scikit-build-core drives CMake, nanobind binds the C++ core and
# setuptools-scm derives the version from the git tags. Each floor is the
# oldest release the CI job "Test with the oldest supported versions" builds
# with, and none has an upper bound:
# - scikit-build-core 0.11.0 is the first that reads the license expression in
#   [project] (https://scikit-build-core.readthedocs.io/en/latest/about/changelog.html).
# - nanobind 1.9.2 is the last release of its 1.x series
#   (https://nanobind.readthedocs.io/en/latest/changelog.html).
# - setuptools-scm 8.0.1 is the first release of its 8.x series on PyPI
#   (https://pypi.org/project/setuptools-scm/#history).
requires = ["scikit-build-core>=0.11", "nanobind>=1.9.2", "setuptools-scm>=8.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "parkin"
dynamic = ["version"]
description = "High-performance computation of particle kinematics on array data, with a C++ core using SIMD, multithreading and CUDA."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Alkaid Cheng", email = "alkaidc@stanford.edu" }]
keywords = [
    "kinematics",
    "four-vectors",
    "particle physics",
    "high energy physics",
    "nuclear physics",
    "astroparticle physics",
    "jets",
    "event shapes",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]

# NumPy 1.23.2 is the first release with wheels for Python 3.11, the oldest
# Python supported (https://numpy.org/doc/stable/release/1.23.2-notes.html).
# The tests run against it and against the newest release, and there is no
# upper bound.
dependencies = ["numpy>=1.23.2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]

[project.urls]
Repository = "https://github.com/AlkaidCheng/parkin"

[tool.scikit-build]
minimum-version = "build-system.requires"
# CMake's build tree is kept between builds, so a rebuild compiles only what
# changed.
build-dir = "build/{wheel_tag}"
# One stable-ABI wheel serves CPython 3.12 and later; CPython 3.11 gets a
# wheel of its own (https://nanobind.readthedocs.io/en/latest/packaging.html).
wheel.py-api = "cp312"
wheel.packages = ["src/parkin"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# Used where the git history is absent, as in an archive downloaded from the
# repository host.
fallback_version = "0.0.0"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C90"]
# Black owns line length.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["parkin"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/parkin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
